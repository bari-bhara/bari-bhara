# Applies new Supabase migrations to the production project when they land on main.
# See docs/adr/0006-local-supabase-cli-workflow.md.
#
# Required repository settings (Settings → Secrets and variables → Actions):
#   Secret   SUPABASE_ACCESS_TOKEN  personal access token (scope it to this project)
#   Secret   SUPABASE_DB_PASSWORD   production database password
#   Variable SUPABASE_PROJECT_ID    project ref, e.g. the subdomain of the project URL

name: Supabase migrations

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

# Never run two pushes against the database at once; let a running one finish.
concurrency:
  group: supabase-migrations-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  push:
    name: Push migrations to production
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          # Keep in sync with the `supabase` devDependency in package.json.
          version: 2.119.0

      - name: Check configuration
        run: |
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            if [ -z "${!name}" ]; then echo "::error::$name is not set"; missing=1; fi
          done
          exit $missing

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Pending migrations
        run: supabase db push --dry-run

      - name: Apply migrations
        run: supabase db push --yes
